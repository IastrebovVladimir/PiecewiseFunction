name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gnuplot
        run: |
          sudo apt-get update
          sudo apt-get install -y gnuplot

      - name: Build and test
        run: |
          cmake -S . -B build
          cmake --build build
          cd build
          ctest --output-on-failure
